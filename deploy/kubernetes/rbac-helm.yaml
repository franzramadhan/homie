apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: homie-helm
rules:
  - apiGroups: [""]
    resources: [secrets]
    verbs: [list]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: homie-helm
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: homie-helm
subjects:
  - kind: ServiceAccount
    name: homie
    namespace: homie
