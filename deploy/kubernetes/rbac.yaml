apiVersion: v1
kind: ServiceAccount
metadata:
  name: homie
  namespace: homie
---
# Read-only view of what the Workloads, GitOps and Security pages show.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: homie-reader
rules:
  - apiGroups: [""]
    resources: [nodes, namespaces, pods, events]
    verbs: [get, list, watch]
  - apiGroups: [apps]
    resources: [deployments, statefulsets, daemonsets]
    verbs: [get, list, watch]
  - apiGroups: [source.toolkit.fluxcd.io, kustomize.toolkit.fluxcd.io, helm.toolkit.fluxcd.io]
    resources: ["*"]
    verbs: [get, list, watch]
  - apiGroups: [wgpolicyk8s.io, openreports.io]
    resources: ["*"]
    verbs: [get, list, watch]
  - apiGroups: [argoproj.io]
    resources: [applications]
    verbs: [get, list, watch]
  - apiGroups: [postgresql.cnpg.io]
    resources: [clusters, backups]
    verbs: [get, list, watch]
---
# Reconcile only adds an annotation, but RBAC cannot tell an annotation patch
# from a spec patch: this role can patch Flux objects.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: homie-flux
rules:
  - apiGroups: [source.toolkit.fluxcd.io, kustomize.toolkit.fluxcd.io, helm.toolkit.fluxcd.io]
    resources: ["*"]
    verbs: [patch]
  # Argo CD refresh is an annotation as well
  - apiGroups: [argoproj.io]
    resources: [applications]
    verbs: [patch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: homie-reader
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: homie-reader
subjects:
  - kind: ServiceAccount
    name: homie
    namespace: homie
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: homie-flux
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: homie-flux
subjects:
  - kind: ServiceAccount
    name: homie
    namespace: homie
---
# The workflow picker saves its watch list in one ConfigMap (RFC 0015).
# RBAC cannot limit create to a name; get and update are limited to it.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: homie-github-watch
  namespace: homie
rules:
  - apiGroups: [""]
    resources: [configmaps]
    verbs: [create]
  - apiGroups: [""]
    resources: [configmaps]
    resourceNames: [homie-github-watch]
    verbs: [get, update]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: homie-github-watch
  namespace: homie
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: homie-github-watch
subjects:
  - kind: ServiceAccount
    name: homie
    namespace: homie
