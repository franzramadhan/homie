[package]
name = "homie"
version = "0.1.0-rc.2"
edition = "2024"
license = "MIT"
description = "One page for the whole homelab"
repository = "https://github.com/franzramadhan/homie"

[dependencies]
argon2 = { version = "0.6.0", features = ["getrandom"] }
axum = "0.8.9"
base64 = "0.23.1"
figment = { version = "0.10.19", features = ["toml", "env"] }
flate2 = "1.1.10"
http = "1.5.0"
futures = "0.3.34"
jiff = { version = "0.2.38", features = ["tzdb-bundle-always"] }
k8s-openapi = { version = "0.28.0", features = ["v1_32"] }
kube = { version = "4.2.0", default-features = false, features = ["client", "config", "rustls-tls", "ring", "webpki-roots"] }
mime_guess = "2.0.5"
openidconnect = { version = "4.0.1", default-features = false }
reqwest = { version = "0.13.5", default-features = false, features = ["json", "rustls-no-provider", "query", "form"] }
rust-embed = "8.13.0"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["macros", "rt-multi-thread", "signal", "process", "fs", "sync", "time"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
url = "2.5.8"
webpki-root-certs = "1.0.10"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
panic = "abort"

[dev-dependencies]
figment = { version = "0.10.19", features = ["test"] }
