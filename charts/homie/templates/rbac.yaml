{{- if .Values.rbac.create }}
{{- $name := include "homie.name" . }}
{{- $sa := include "homie.serviceAccount" . }}
# Read-only view of what the Workloads, GitOps and Security pages show.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ $name }}-reader
  labels:
    {{- include "homie.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: [nodes, namespaces, pods, events]
    verbs: [get, list, watch]
  - apiGroups: [apps]
    resources: [deployments, statefulsets, daemonsets]
    verbs: [get, list, watch]
  - apiGroups: [source.toolkit.fluxcd.io, kustomize.toolkit.fluxcd.io, helm.toolkit.fluxcd.io]
    resources: ["*"]
    verbs: [get, list, watch]
  - apiGroups: [wgpolicyk8s.io, openreports.io]
    resources: ["*"]
    verbs: [get, list, watch]
  - apiGroups: [argoproj.io]
    resources: [applications]
    verbs: [get, list, watch]
  - apiGroups: [postgresql.cnpg.io]
    resources: [clusters, backups]
    verbs: [get, list, watch]
  # certificate discovery and cert-manager status (RFC 0018); no Secrets
  - apiGroups: [""]
    resources: [services]
    verbs: [get, list]
  - apiGroups: [networking.k8s.io]
    resources: [ingresses]
    verbs: [get, list]
  - apiGroups: [gateway.networking.k8s.io]
    resources: [gateways, httproutes, tlsroutes]
    verbs: [get, list]
  - apiGroups: [cert-manager.io]
    resources: [certificates]
    verbs: [get, list]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ $name }}-reader
  labels:
    {{- include "homie.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ $name }}-reader
subjects:
  - kind: ServiceAccount
    name: {{ $sa }}
    namespace: {{ .Release.Namespace }}
{{- if .Values.rbac.actions }}
---
# Flux reconcile and Argo CD refresh are annotations, but RBAC cannot tell an
# annotation patch from a spec patch.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ $name }}-actions
  labels:
    {{- include "homie.labels" . | nindent 4 }}
rules:
  - apiGroups: [source.toolkit.fluxcd.io, kustomize.toolkit.fluxcd.io, helm.toolkit.fluxcd.io]
    resources: ["*"]
    verbs: [patch]
  - apiGroups: [argoproj.io]
    resources: [applications]
    verbs: [patch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ $name }}-actions
  labels:
    {{- include "homie.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ $name }}-actions
subjects:
  - kind: ServiceAccount
    name: {{ $sa }}
    namespace: {{ .Release.Namespace }}
{{- end }}
{{- if .Values.rbac.githubWatch }}
---
# The workflow picker saves its watch list in one ConfigMap (RFC 0015).
# RBAC cannot limit create to a name; get and update are limited to it.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ $name }}-github-watch
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "homie.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: [configmaps]
    verbs: [create]
  - apiGroups: [""]
    resources: [configmaps]
    resourceNames: [homie-github-watch]
    verbs: [get, update]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ $name }}-github-watch
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "homie.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ $name }}-github-watch
subjects:
  - kind: ServiceAccount
    name: {{ $sa }}
    namespace: {{ .Release.Namespace }}
{{- end }}
{{- if .Values.rbac.helmReleases }}
---
# The Helm releases view lists Secrets of type helm.sh/release.v1; RBAC
# cannot narrow this to Helm's Secrets. Homie never returns values.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ $name }}-helm
  labels:
    {{- include "homie.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: [secrets]
    verbs: [list]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ $name }}-helm
  labels:
    {{- include "homie.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ $name }}-helm
subjects:
  - kind: ServiceAccount
    name: {{ $sa }}
    namespace: {{ .Release.Namespace }}
{{- end }}
{{- end }}
