apiVersion: v1
kind: Service
metadata:
  name: {{ include "homie.name" . }}
  labels:
    {{- include "homie.labels" . | nindent 4 }}
spec:
  selector:
    {{- include "homie.selector" . | nindent 4 }}
  ports:
    - name: http
      port: {{ .Values.service.port }}
      targetPort: http
    {{- if .Values.metrics.enabled }}
    - name: metrics
      port: {{ .Values.metrics.port }}
      targetPort: metrics
    {{- end }}
