name: ci

# Pull requests only. Pushes to main and tags are handled by build.yml.
# test and web run only when their code changed; a docs-only PR skips them
# (a skipped required check counts as passing).
on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  changes:
    runs-on: ubuntu-26.04
    permissions:
      contents: read
      pull-requests: read
    outputs:
      rust: ${{ steps.files.outputs.rust }}
      web: ${{ steps.files.outputs.web }}
      chart: ${{ steps.files.outputs.chart }}
      bend: ${{ steps.files.outputs.bend }}
    steps:
      - id: files
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          files=$(gh pr diff "$PR" --repo "$GITHUB_REPOSITORY" --name-only)
          printf '%s\n' "$files"
          rust=false
          web=false
          chart=false
          bend=false
          if grep -qE '^(src/|examples/|Cargo\.(toml|lock)$|rust-toolchain\.toml$|\.github/workflows/ci\.yml$)' <<<"$files"; then rust=true; fi
          if grep -qE '^(web/|\.github/workflows/ci\.yml$)' <<<"$files"; then web=true; fi
          if grep -qE '^(charts/|\.github/workflows/ci\.yml$)' <<<"$files"; then chart=true; fi
          # the laws, their proofs and the model, and the Rust code the model mirrors
          if grep -qE '(\.bend$|^spec/|^src/server/(guard|console)\.rs$|^src/integrations/proxmox\.rs$|^\.github/workflows/ci\.yml$)' <<<"$files"; then bend=true; fi
          printf 'rust=%s\nweb=%s\nchart=%s\nbend=%s\n' "$rust" "$web" "$chart" "$bend" >> "$GITHUB_OUTPUT"

  test:
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # rustup on the runner installs the toolchain from rust-toolchain.toml
      # on the first cargo call.
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: cargo fmt --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo test --locked

  web:
    needs: changes
    if: needs.changes.outputs.web == 'true'
    runs-on: ubuntu-26.04
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.4
      - run: bun install --frozen-lockfile
      - run: bun run check:contrast
      - run: bun run build

  chart:
    needs: changes
    if: needs.changes.outputs.chart == 'true'
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: v4.3.1
      - run: helm lint charts/homie --strict
      - run: helm template homie charts/homie --set rbac.helmReleases=true --set ingress.enabled=true --set httpRoute.enabled=true > /dev/null

  # bend PROOF.bend proves LAWS.bend; --verdict rechecks with the BendTT
  # kernel, which is proven in Lean. Both tools are release tarballs pinned by
  # version and sha256 (the same pins as bend-lang.com/install.sh), not a
  # piped installer.
  bend:
    needs: changes
    if: needs.changes.outputs.bend == 'true'
    runs-on: ubuntu-26.04
    env:
      BEND_VERSION: "2.0.38"
      BEND_SHA256: f19d088b079c9e1a8834ecd153b7d58c11a5f8f9ab1bdb78dbc96a6bf49aaa81
      LEAN_VERSION: "4.34.0"
      LEAN_SHA256: caaa98356098c85dc0fcbbd28e1ec66f39eb6551829972b752ff20e1286b646b
      BEND_NO_TELEMETRY: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Lean (580 MB) and the kernel built from it, per version
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/lean
            ~/.bend/bendtt
          key: bend-${{ env.BEND_VERSION }}-lean-${{ env.LEAN_VERSION }}
      - name: Install Bend and Lean
        run: |
          set -euo pipefail
          name="bend-${BEND_VERSION}-linux-x64.tar.gz"
          curl --proto '=https' --tlsv1.2 -fsSL -o "/tmp/$name" \
            "https://github.com/bendlang/bend/releases/download/v${BEND_VERSION}/$name"
          echo "$BEND_SHA256  /tmp/$name" | sha256sum -c -
          tar -xzf "/tmp/$name" -C /tmp
          mkdir -p ~/.bend/bin
          mv /tmp/bend/bend2 /tmp/bend/guide ~/.bend/
          mv /tmp/bend/bin/bend ~/.bend/bin/bend
          echo "$HOME/.bend/bin" >> "$GITHUB_PATH"
          if [ ! -x ~/lean/bin/lean ]; then
            lname="lean-${LEAN_VERSION}-linux.tar.zst"
            curl --proto '=https' --tlsv1.2 -fsSL -o "/tmp/$lname" \
              "https://github.com/leanprover/lean4/releases/download/v${LEAN_VERSION}/$lname"
            echo "$LEAN_SHA256  /tmp/$lname" | sha256sum -c -
            mkdir -p ~/lean
            tar --zstd -xf "/tmp/$lname" -C ~/lean --strip-components=1
            rm "/tmp/$lname"
          fi
          echo "$HOME/lean/bin" >> "$GITHUB_PATH"
      - run: bend PROOF.bend
      - run: bend PROOF.bend --verdict

