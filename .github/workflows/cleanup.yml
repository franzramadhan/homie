name: cleanup

# Deletes stale images from ghcr.io/<owner>/homie. Kept: release tags
# (0.2.0, 0.2, latest) and dev-* builds younger than DEV_DAYS. Deleted: other
# tags (main, sha-*, rc builds), older dev-* builds, and untagged manifests
# that no kept image references (the per-platform images and attestations of
# deleted ones).
on:
  schedule:
    - cron: "23 3 * * 1"
  workflow_dispatch:
    inputs:
      dry_run:
        description: List what would be deleted, delete nothing
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  images:
    runs-on: ubuntu-26.04
    permissions:
      packages: write
    env:
      GH_TOKEN: ${{ github.token }}
      OWNER: ${{ github.repository_owner }}
      DRY_RUN: ${{ inputs.dry_run || 'false' }}
      DEV_DAYS: "14"
    steps:
      - name: Delete stale versions
        run: |
          api="users/${OWNER}/packages/container/homie/versions"
          gh api --paginate "${api}?per_page=100" --jq '.[] | [.id, .name, .created_at, (.metadata.container.tags | join(","))] | @tsv' > versions.tsv
          cutoff=$(date -u -d "-${DEV_DAYS} days" +%Y-%m-%dT%H:%M:%SZ)
          : > keep.txt; : > delete.tsv
          while IFS=$'\t' read -r id digest created tags; do
            [ -z "$tags" ] && continue
            if grep -qE '(^|,)(latest|[0-9]+\.[0-9]+(\.[0-9]+)?)(,|$)' <<<"$tags" \
              || { [[ "$tags" == dev-* ]] && [[ "$created" > "$cutoff" ]]; }; then
              echo "$digest" >> keep.txt
              # what a kept index points to: platform images and attestations
              docker buildx imagetools inspect --raw "ghcr.io/${OWNER}/homie@${digest}" \
                | jq -r '.manifests[]?.digest' >> keep.txt
            else
              printf '%s\t%s\n' "$id" "$tags" >> delete.tsv
            fi
          done < versions.tsv
          while IFS=$'\t' read -r id digest created tags; do
            # an untagged version newer than an hour may belong to a build in progress
            if [ -z "$tags" ] && ! grep -qx "$digest" keep.txt \
              && [[ "$created" < "$(date -u -d '-1 hour' +%Y-%m-%dT%H:%M:%SZ)" ]]; then
              printf '%s\t(untagged %s)\n' "$id" "${digest:7:12}" >> delete.tsv
            fi
          done < versions.tsv
          echo "$(wc -l < versions.tsv) versions, $(wc -l < delete.tsv) stale"
          while IFS=$'\t' read -r id what; do
            if [ "$DRY_RUN" = true ]; then
              echo "would delete $id $what"
            else
              gh api --method DELETE "${api}/${id}" && echo "deleted $id $what"
            fi
          done < delete.tsv
